name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # yeslogic-fontconfig-sys and freetype-sys link against system libraries
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - run: cargo build --locked
      - run: cargo test --locked
